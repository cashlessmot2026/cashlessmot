<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motel Cashless</title>
<meta name="theme-color" content="#0a0608">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--red:#e11d48;--red2:#ff3b57;--wine:#5a0f1e;--wine2:#8a1a30;--bg:#08050a;--tx:#f4eaec;--mut:#b9a4a9;
--free:#22c55e;--occ:#ef233c;--over:#facc15;--clean:#38bdf8;--off:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 20% -10%,#3b0a17 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#2a0710 0%,transparent 55%),var(--bg);
color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
.ui>*{pointer-events:auto}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(225,29,72,.12);border-radius:20px}
.top{margin:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;animation:down .6s cubic-bezier(.2,.9,.3,1)}
.brand{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--red2),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:0;background:transparent;color:var(--mut);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;transition:.25s;position:relative}
.tab:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateY(-1px)}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--wine2),var(--red));box-shadow:0 4px 18px rgba(225,29,72,.45)}
.panel{margin:0 12px 12px;padding:18px;flex:1;overflow:auto;animation:up .45s cubic-bezier(.2,.9,.3,1)}
.panel::-webkit-scrollbar,.modal::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:rgba(225,29,72,.4);border-radius:8px}
.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.13);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.btn:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s}
.btn:hover::after{left:140%}
.btn.p{background:linear-gradient(135deg,var(--wine2),var(--red));border-color:rgba(255,120,140,.5);box-shadow:0 4px 18px rgba(225,29,72,.4)}
.btn.p:hover{box-shadow:0 8px 28px rgba(225,29,72,.65)}
.btn.g{background:linear-gradient(135deg,#14532d,#22c55e)}.btn.y{background:linear-gradient(135deg,#854d0e,#facc15);color:#111}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;outline:none;transition:.25s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,72,.25)}
select option{background:#1a0a0e}
.f{display:block;margin-bottom:10px}.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);transition:.3s;animation:up .5s both}
.card:hover{transform:translateY(-3px);border-color:rgba(225,29,72,.5);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h4{margin:0 0 6px}.big{font-size:28px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#000}
.chip.pulse{animation:pulse 1s infinite}
h2{margin:0 0 14px;font-weight:800}h3{margin:14px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--wine2),var(--red2));border-radius:8px;transition:width .8s}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s}
.modal{width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
.modal.w{width:min(980px,100%)}
.x{position:absolute;right:14px;top:10px}
.toasts{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:14px;animation:pop .35s;max-width:340px;font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;padding:8px 12px;margin:0 12px 12px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.hero{margin:auto;padding:34px;max-width:560px;width:calc(100% - 28px);text-align:center;animation:up .7s cubic-bezier(.2,.9,.3,1)}
.hero h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px;font-weight:900}
.hero .sub{color:var(--mut);margin-bottom:22px}
.bell{position:relative;font-size:20px}.bell b{position:absolute;top:-6px;right:-6px;background:var(--red);border-radius:99px;font-size:11px;padding:1px 6px;animation:pulse 1s infinite}
.ring{animation:ring .8s infinite}
.check{width:140px;height:140px}.check circle{stroke:#22c55e;stroke-width:6;fill:rgba(34,197,94,.12);stroke-dasharray:340;stroke-dashoffset:340;animation:dash .7s forwards}
.check path{stroke:#22c55e;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:dash .5s .5s forwards}
.cross circle{stroke:#ef233c;fill:rgba(239,35,60,.12)}.cross path{stroke:#ef233c}
.proof{max-width:100%;max-height:60vh;border-radius:12px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.2)}
.room-card{cursor:pointer;border-left:4px solid var(--c,#999)}
.room-card.hl{animation:glow 1.2s infinite}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.hint{font-size:12px;color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200%}}
@keyframes pulse{50%{opacity:.45;transform:scale(1.08)}}
@keyframes glow{50%{box-shadow:0 0 28px var(--c)}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-8deg)}}
@keyframes dash{to{stroke-dashoffset:0}}
@media(max-width:640px){.panel{padding:12px}.top{margin:8px}.tab{padding:7px 10px;font-size:13px}}
#ticket{display:none}
.tk{width:54mm;margin:0 auto;color:#000;background:#fff;font:12px/1.35 'Courier New',monospace;font-weight:700;padding:2mm 0}
.tk h1{font:900 16px Arial,sans-serif;text-align:center;margin:0 0 2px}.tk .c{text-align:center}.tk hr{border:0;border-top:1px dashed #000;margin:5px 0}
.tk .r{display:flex;justify-content:space-between;gap:6px}.tk .r span:first-child{flex:1;word-break:break-word}.tk .tot{font-size:16px;font-weight:900}
@media print{@page{size:58mm auto;margin:0}
html,body{height:auto!important;overflow:visible!important;background:#fff!important}
#scene,#root,.toasts,.overlay{display:none!important}#ticket{display:block!important}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="root"></div>
<div id="ticket"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback,createContext,useContext}=React;
const CFG=window.MOTEL_CONFIG||{};
const CLOUD=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY);

/* ================= Utilidades ================= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const pad=n=>String(n).padStart(2,'0');
const dur=ms=>{const s=Math.floor(Math.abs(ms)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
const fdate=t=>new Date(t).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const toLocalInput=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const code6=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('motel|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of 'motel|'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(16)}}
const imgToData=(file,max=900)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)});
const LS=(k,v)=>{try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null}localStorage.setItem(k,JSON.stringify(v))}catch{return null}};
const SS=(k,v)=>{try{if(v===undefined){return sessionStorage.getItem(k)}v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch{return null}};
const toast=(m,t='')=>window.dispatchEvent(new CustomEvent('toast',{detail:{m,t}}));

const STATUS={free:{l:'Libre',c:'#22c55e'},occupied:{l:'Ocupada',c:'#ef233c'},overtime:{l:'Tiempo excedido',c:'#facc15'},cleaning:{l:'Limpieza',c:'#38bdf8'},unavailable:{l:'No disponible',c:'#6b7280'}};
const DEFAULTS={motelName:'Motel Cashless',adminPin:'1234',extraPerMin:500,nightHours:12,categories:['Estándar','Suite','VIP'],payInfo:'Transferir a Nequi / Bancolombia 300 000 0000 y adjuntar el comprobante.'};

/* ================= Sonido / Push ================= */
let AC;const unlock=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch{}};
['click','touchstart','keydown'].forEach(e=>addEventListener(e,unlock));
function siren(sec=3){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';g.gain.value=.55;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;for(let i=0;i<sec*4;i++)o.frequency.setValueAtTime(i%2?720:1100,t+i*.25);o.start(t);o.stop(t+sec)}catch{}}
async function push(title,body){try{if('Notification' in window&&Notification.permission==='granted'){const reg=await navigator.serviceWorker?.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon.svg',vibrate:[300,100,300],tag:title+body});else new Notification(title,{body})}}catch{}try{navigator.vibrate?.([300,100,300,100,300])}catch{}}
async function readNFC(){if(!('NDEFReader' in window))throw new Error('NFC no soportado en este dispositivo/navegador (Chrome Android). Ingresa el código manualmente.');const r=new NDEFReader();await r.scan();return new Promise((res,rej)=>{r.onreading=e=>{let txt='';try{for(const rec of e.message.records){if(rec.recordType==='text')txt=new TextDecoder(rec.encoding||'utf-8').decode(rec.data)}}catch{}res({serial:e.serialNumber,text:txt})};r.onreadingerror=()=>rej(new Error('No se pudo leer el tag'))})}

/* ================= Capa de datos (local / Supabase) ================= */
const TABLES=['rooms','objects','products','staff','reservations','accounts','invoices','cleanlogs','attendance','clients','settings','waiting'];
function useStore(){
  const [data,setData]=useState(()=>{const d={};TABLES.forEach(t=>d[t]=LS('motel_'+t)||[]);return d});
  const [online,setOnline]=useState(CLOUD?null:true);const [ready,setReady]=useState(!CLOUD);
  const ref=useRef(data);const queue=useRef(LS('motel_queue')||[]);const busy=useRef(false);
  const hdr={apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY,'Content-Type':'application/json'};
  const base=(CFG.SUPABASE_URL||'')+'/rest/v1/';
  const commit=(t,rows)=>{ref.current={...ref.current,[t]:rows};setData(ref.current);LS('motel_'+t,rows)};
  const flush=async()=>{if(!CLOUD||busy.current)return;busy.current=true;
    while(queue.current.length){const op=queue.current[0];
      try{const r=op.op==='put'?await fetch(base+op.t+'?on_conflict=id',{method:'POST',headers:{...hdr,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:op.id,data:op.data})}):await fetch(base+op.t+'?id=eq.'+encodeURIComponent(op.id),{method:'DELETE',headers:hdr});
        if(!r.ok)throw new Error(await r.text());queue.current.shift();LS('motel_queue',queue.current)}
      catch(e){console.warn('sync',e);setOnline(false);break}}
    busy.current=false};
  const put=(t,obj)=>{const rows=ref.current[t];const i=rows.findIndex(r=>r.id===obj.id);const m=i>=0?{...rows[i],...obj}:{...obj};
    commit(t,i>=0?rows.map((r,k)=>k===i?m:r):[...rows,m]);
    if(CLOUD){queue.current.push({op:'put',t,id:m.id,data:m});LS('motel_queue',queue.current);flush()}return m};
  const del=(t,id)=>{commit(t,ref.current[t].filter(r=>r.id!==id));if(CLOUD){queue.current.push({op:'del',t,id});LS('motel_queue',queue.current);flush()}};
  useEffect(()=>{let stop=false;
    let first=true;
    const poll=async()=>{if(document.hidden&&!first)return;first=false;
      if(!CLOUD){TABLES.forEach(t=>{const v=LS('motel_'+t)||[];if(JSON.stringify(v)!==JSON.stringify(ref.current[t])){ref.current={...ref.current,[t]:v};setData(ref.current)}});return}
      await flush();if(queue.current.length)return;
      try{const res=await Promise.all(TABLES.map(t=>fetch(base+t+'?select=id,data&order=created_at',{headers:hdr}).then(r=>{if(!r.ok)throw new Error(t+' '+r.status);return r.json()})));
        if(stop)return;let next=ref.current,ch=false;
        res.forEach((rows,i)=>{const t=TABLES[i];const arr=rows.map(r=>({...r.data,id:r.id}));if(JSON.stringify(arr)!==JSON.stringify(next[t])){next={...next,[t]:arr};ch=true;LS('motel_'+t,arr)}});
        if(ch){ref.current=next;setData(next)}setOnline(true);setReady(true)}
      catch(e){console.warn('poll',e);setOnline(false)}};
    poll();const iv=setInterval(poll,CLOUD?3000:1200);document.addEventListener('visibilitychange',poll);
    return()=>{stop=true;clearInterval(iv)}},[]);
  const cfgRow=data.settings.find(s=>s.id==='main');
  const settings={...DEFAULTS,...(cfgRow||{})};
  return {data,put,del,online,ready,settings,hasCfg:!!cfgRow};
}
const Ctx=createContext(null);const useS=()=>useContext(Ctx);

/* ================= Lógica de negocio ================= */
const accOf=(room,accounts)=>accounts.find(a=>a.id===room.accountId&&a.status==='open');
const roomStatus=(room,accounts,now)=>{if(room.status==='occupied'){const a=accOf(room,accounts);if(a&&now>a.endsAt)return 'overtime'}return room.status};
function accTotals(a,now,upTo){const t=upTo||now;const over=t>a.endsAt?Math.ceil((t-a.endsAt)/60000):0;const overAmt=over*(a.extraPerMin||0);
  const sub=a.items.reduce((s,i)=>s+i.qty*i.price,0)+overAmt;const tax=a.items.reduce((s,i)=>s+i.qty*i.price*(i.taxPct||0)/100,0);return {over,overAmt,sub,tax,total:sub+tax}}
function conflict(room,start,end,S,ignore){
  if(room.status==='unavailable')return 'Fuera de servicio';
  const a=accOf(room,S.data.accounts);if(a&&start<a.endsAt&&end>a.start)return 'Ocupada en ese horario';
  const r=S.data.reservations.find(r=>r.room===room.id&&r.id!==ignore&&['pending','approved'].includes(r.status)&&start<r.end&&end>r.start);
  if(r)return 'Reservada en ese horario';return null}
function priceFor(room,mode,hours,S){return mode==='night'?room.priceNight:room.priceHour*hours}
function startOccupation(S,room,{minutes,mode,amount,name}){
  const a={id:uid(),roomId:room.id,roomNumber:room.number,start:Date.now(),endsAt:Date.now()+minutes*60000,mode,extraPerMin:S.settings.extraPerMin,status:'open',items:[{id:uid(),kind:'time',name,qty:1,price:amount,taxPct:0}]};
  S.put('accounts',a);S.put('rooms',{id:room.id,status:'occupied',accountId:a.id,cleaner:null,cleanStart:null});return a}
function addTime(S,acc,minutes,price){const now=Date.now();let items=[...acc.items];let ends=acc.endsAt;
  if(now>ends){const t=accTotals(acc,now);if(t.over>0)items.push({id:uid(),kind:'time',name:`Excedente ${t.over} min`,qty:1,price:t.overAmt,taxPct:0});ends=now}
  items.push({id:uid(),kind:'time',name:`Tiempo adicional ${minutes} min`,qty:1,price,taxPct:0});S.put('accounts',{id:acc.id,items,endsAt:ends+minutes*60000})}
function addProduct(S,acc,p,qty){if(p.stock<qty)return toast('Stock insuficiente','err');
  S.put('accounts',{id:acc.id,items:[...acc.items,{id:uid(),kind:'product',productId:p.id,name:p.name,qty,price:p.price,taxPct:p.tax||0}]});S.put('products',{id:p.id,stock:p.stock-qty})}
function liquidate(S,room,acc,method){const now=Date.now();const t=accTotals(acc,now);let items=[...acc.items];
  if(t.over>0)items.push({id:uid(),kind:'time',name:`Excedente ${t.over} min`,qty:1,price:t.overAmt,taxPct:0});
  const sub=items.reduce((s,i)=>s+i.qty*i.price,0),tax=items.reduce((s,i)=>s+i.qty*i.price*(i.taxPct||0)/100,0);
  const inv={id:uid(),number:'F-'+String(S.data.invoices.length+1).padStart(5,'0'),roomId:room.id,roomNumber:room.number,items,subtotal:sub,tax,total:sub+tax,method,start:acc.start,end:now,at:now};
  S.put('invoices',inv);S.put('accounts',{id:acc.id,status:'closed',invoiceId:inv.id,items});
  S.put('rooms',{id:room.id,status:'cleaning',accountId:null,cleaner:null,cleanStart:null});return inv}
function seed(S){
  if(!S.data.settings.length)S.put('settings',{id:'main',...DEFAULTS});
  if(!S.data.rooms.length){const cats=DEFAULTS.categories;[-4.5,-1.5,1.5,4.5].forEach((x,i)=>[-2.2,1.6].forEach((z,j)=>{const n=101+i+j*4;
    S.put('rooms',{id:uid()+n,number:String(n),category:cats[(i+j)%3],priceHour:30000+((i+j)%3)*15000,priceNight:120000+((i+j)%3)*40000,defaultMin:120,x,z,status:'free',accountId:null,tagId:''})}))}
  if(!S.data.objects.length){[['arch_in',-9,6],['arch_out',9,6],['parking',-6,-7],['parking',0,-7],['building',8,-6],['tree',-10,-3],['tree',10,2]].forEach(([type,x,z])=>S.put('objects',{id:uid(),type,x,z}))}
  if(!S.data.products.length){[['Cerveza',8000,24,19],['Agua',3000,40,0],['Gaseosa',4000,30,19],['Kit aseo',12000,15,19],['Snack',6000,20,19]].forEach(([name,price,stock,tax])=>S.put('products',{id:uid(),name,price,stock,tax,photo:''}))}
}

/* ================= Alertas ================= */
function useAlerts(S,now,on){
  const prev=useRef(null);const [events,setEvents]=useState([]);const [unread,setUnread]=useState(0);
  useEffect(()=>{if(!on||!S.ready)return;const cur={};S.data.rooms.forEach(r=>cur[r.id]=roomStatus(r,S.data.accounts,now));
    if(prev.current){const ev=[];S.data.rooms.forEach(r=>{const p=prev.current[r.id],c=cur[r.id];if(p&&p!==c)ev.push({id:uid(),roomId:r.id,num:r.number,status:c,at:Date.now(),text:c==='overtime'?`⚠ Hab ${r.number}: TIEMPO EXCEDIDO`:c==='cleaning'?`🧹 Hab ${r.number} pasó a LIMPIEZA`:c==='free'?`✅ Hab ${r.number} quedó LIBRE`:c==='occupied'?`🔴 Hab ${r.number} OCUPADA`:`⛔ Hab ${r.number} no disponible`}) });
      if(ev.length){setEvents(e=>[...ev,...e].slice(0,80));setUnread(u=>u+ev.length);const hot=ev.some(e=>['overtime','cleaning'].includes(e.status));siren(hot?4:2);ev.forEach(e=>{push('Motel',e.text);toast(e.text,e.status==='overtime'?'warn':'')})}}
    prev.current=cur},[now,S.data.rooms,S.data.accounts,S.ready,on]);
  return {events,unread,clear:()=>setUnread(0)}}

/* ================= UI base ================= */
function Modal({children,onClose,wide}){return <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><div className={'glass modal '+(wide?'w':'')} style={{position:'relative'}}><button className="btn sm x" onClick={onClose}>✕</button>{children}</div></div>}
const Field=({l,children})=><label className="f"><span>{l}</span>{children}</label>;
function Chip({s,pulse}){const m=STATUS[s]||STATUS.free;return <span className={'chip '+(pulse?'pulse':'')} style={{background:m.c}}>{m.l}</span>}
function ToastHost(){const [l,setL]=useState([]);useEffect(()=>{const h=e=>{const id=uid();setL(x=>[...x,{id,...e.detail}]);setTimeout(()=>setL(x=>x.filter(i=>i.id!==id)),4500)};addEventListener('toast',h);return()=>removeEventListener('toast',h)},[]);
  return <div className="toasts">{l.map(t=><div key={t.id} className="glass toast" style={{borderColor:t.t==='err'?'#ef233c':t.t==='warn'?'#facc15':'rgba(255,255,255,.2)'}}>{t.m}</div>)}</div>}
function QR({text,size=5}){const html=useMemo(()=>{try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(size,0)}catch{return ''}},[text]);return <div className="qrbox" dangerouslySetInnerHTML={{__html:html}}/>}
function Bell({A,onPick}){const [open,setOpen]=useState(false);
  return <div style={{position:'relative'}}><button className="btn sm" onClick={()=>{setOpen(!open);A.clear();if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}}><span className={'bell '+(A.unread?'ring':'')}>🔔{A.unread>0&&<b>{A.unread}</b>}</span></button>
    {open&&<div className="glass" style={{position:'absolute',right:0,top:44,width:300,maxHeight:360,overflow:'auto',padding:10,zIndex:30}}>{!A.events.length&&<div className="mut">Sin alertas aún</div>}
      {A.events.map(e=><div key={e.id} className="card" style={{padding:8,marginBottom:6,cursor:'pointer',borderColor:STATUS[e.status].c}} onClick={()=>{setOpen(false);onPick&&onPick(e.roomId)}}>{e.text}<div className="hint">{fdate(e.at)}</div></div>)}</div>}</div>}
function QRScanner({onResult,onClose}){const v=useRef();const [err,setErr]=useState('');
  useEffect(()=>{let stream,stop=false;(async()=>{try{if(!('BarcodeDetector' in window))throw new Error('Este navegador no soporta escaneo QR. Usa el código manual o NFC.');
    const det=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.current.srcObject=stream;await v.current.play();
    const loop=async()=>{if(stop)return;try{const r=await det.detect(v.current);if(r.length){onResult(r[0].rawValue);return}}catch{}requestAnimationFrame(loop)};loop()}catch(e){setErr(e.message)}})();
    return()=>{stop=true;stream&&stream.getTracks().forEach(t=>t.stop())}},[]);
  return <Modal onClose={onClose}><h3>Escanear QR</h3>{err?<p className="mut">{err}</p>:<video ref={v} playsInline muted style={{width:'100%',borderRadius:14}}/>}</Modal>}

function sprite(text,color='#fff',w=1.5,h=.55){const c=document.createElement('canvas');c.width=256;c.height=96;const x=c.getContext('2d');x.fillStyle='rgba(10,5,8,.65)';x.beginPath();x.roundRect?x.roundRect(8,8,240,80,24):x.rect(8,8,240,80);x.fill();x.strokeStyle=color;x.lineWidth=4;x.stroke();x.fillStyle=color;x.font='bold 46px Segoe UI,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,50);
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(w,h,1);s.renderOrder=10;return s}
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.15,...o});
function makeRoom(num){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,1,1.4),std(0x888888));body.position.y=.5;
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.35,.75,4),std(0x2a0a10,{roughness:.8}));roof.position.y=1.37;roof.rotation.y=Math.PI/4;roof.scale.z=.88;
  const door=new THREE.Mesh(new THREE.BoxGeometry(.36,.62,.05),std(0x120508));door.position.set(0,.31,.71);
  const win=new THREE.Mesh(new THREE.BoxGeometry(.3,.26,.05),std(0xffd27a,{emissive:0xffb347,emissiveIntensity:.6}));win.position.set(.5,.62,.71);
  const lab=sprite(num);lab.position.y=2.15;g.add(body,roof,door,win,lab);g.userData.body=body;g.userData.lab=lab;g.userData.num=num;return g}
function makeObject(type){const g=new THREE.Group();
  if(type==='building'){const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.2,2),std(0x2b1318));b.position.y=1.6;g.add(b);for(let i=0;i<4;i++)for(let j=0;j<3;j++){const w=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.05),std(0x331,{emissive:0xff8a3d,emissiveIntensity:Math.random()>.4?.8:.05}));w.position.set(-.7+j*.7,.5+i*.7,1.02);g.add(w)}}
  else if(type==='arch_in'||type==='arch_out'){const c=type==='arch_in'?0x22c55e:0xef233c;const m=std(0x3a1019);[-1.2,1.2].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.3,2.2,.3),m);p.position.set(x,1.1,0);g.add(p)});const t=new THREE.Mesh(new THREE.BoxGeometry(2.9,.35,.4),std(c,{emissive:c,emissiveIntensity:.5}));t.position.y=2.35;g.add(t);const l=sprite(type==='arch_in'?'ENTRADA':'SALIDA',type==='arch_in'?'#4ade80':'#ff6b7f',1.7,.6);l.position.y=3.1;g.add(l)}
  else if(type==='parking'){const s=new THREE.Mesh(new THREE.BoxGeometry(3.4,.06,2.2),std(0x1d1d22));s.position.y=.03;g.add(s);for(let i=-1;i<=2;i++){const ln=new THREE.Mesh(new THREE.BoxGeometry(.04,.02,1.8),std(0xffffff,{emissive:0xffffff,emissiveIntensity:.3}));ln.position.set(-1.5+i*1,.07,0);g.add(ln)}
    [-1,0].forEach(i=>{const car=new THREE.Mesh(new THREE.BoxGeometry(.7,.3,1.2),std(i?0x8a1a30:0x333344));car.position.set(-.5+i*1,.2,0);g.add(car)});const l=sprite('P','#fff',.7,.5);l.position.y=1;g.add(l)}
  else{const t=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,.6),std(0x3d2314));t.position.y=.3;const c=new THREE.Mesh(new THREE.ConeGeometry(.6,1.5,7),std(0x0f3d22));c.position.y=1.3;g.add(t,c)}
  g.userData.type=type;return g}
const OBJ_LABEL={building:'Edificio',arch_in:'Arco entrada',arch_out:'Arco salida',parking:'Parqueadero',tree:'Árbol'};

function Scene({rooms,objects,status,edit,selected,onRoom,onMove}){
  const S=useRef({});const H=useRef({});H.current={onRoom,onMove,edit,rooms,objects};
  useEffect(()=>{const el=document.getElementById('scene');const w=()=>innerWidth,h=()=>innerHeight;
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(w(),h());el.appendChild(renderer.domElement);
    const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x08050a,22,48);const cam=new THREE.PerspectiveCamera(45,w()/h(),.1,100);
    scene.add(new THREE.AmbientLight(0xffffff,.55));const dl=new THREE.DirectionalLight(0xffe6e6,.9);dl.position.set(6,12,8);scene.add(dl);const pl=new THREE.PointLight(0xe11d48,1.2,30);pl.position.set(0,5,0);scene.add(pl);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,28),std(0x120a0e,{roughness:.9,transparent:true,opacity:.92}));ground.rotation.x=-Math.PI/2;scene.add(ground);
    const grid=new THREE.GridHelper(40,40,0x7a1426,0x2a0d14);grid.position.y=.01;scene.add(grid);
    const st=S.current;st.map={};st.omap={};st.scene=scene;st.az=0;st.el=.95;st.d=20;st.pt={x:0,y:0};
    const ray=new THREE.Raycaster(),m=new THREE.Vector2();const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
    const pick=e=>{const r=renderer.domElement.getBoundingClientRect();m.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m,cam);
      const all=[...Object.entries(st.map).map(([id,g])=>['room',id,g]),...Object.entries(st.omap).map(([id,g])=>['obj',id,g])];
      const hit=ray.intersectObjects(all.map(a=>a[2]),true);if(!hit.length)return null;let o=hit[0].object;while(o&&!all.find(a=>a[2]===o))o=o.parent;const f=all.find(a=>a[2]===o);return f?{kind:f[0],id:f[1],g:f[2]}:null};
    const gp=e=>{const r=renderer.domElement.getBoundingClientRect();m.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m,cam);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return p};
    let drag=null,orbit=null,moved=0;
    const down=e=>{moved=0;const p=pick(e);if(p&&H.current.edit){drag=p;renderer.domElement.setPointerCapture(e.pointerId)}else{orbit={x:e.clientX,y:e.clientY,hit:p};renderer.domElement.setPointerCapture(e.pointerId)}};
    const move=e=>{if(drag){const p=gp(e);drag.g.position.set(Math.round(p.x*2)/2,0,Math.round(p.z*2)/2);moved++}else if(orbit){const dx=e.clientX-orbit.x,dy=e.clientY-orbit.y;moved+=Math.abs(dx)+Math.abs(dy);if(!orbit.hit||moved>6){st.az=Math.max(-1,Math.min(1,st.az-dx*.005));st.el=Math.max(.45,Math.min(1.35,st.el+dy*.004))}orbit.x=e.clientX;orbit.y=e.clientY}
      else renderer.domElement.style.cursor=pick(e)?'pointer':'grab'};
    const up=e=>{if(drag){const g=drag.g;if(moved)H.current.onMove(drag.kind,drag.id,g.position.x,g.position.z);else if(drag.kind==='room')H.current.onRoom(drag.id);drag=null}else if(orbit){if(orbit.hit&&moved<8&&orbit.hit.kind==='room')H.current.onRoom(orbit.hit.id);orbit=null}};
    const wheel=e=>{st.d=Math.max(10,Math.min(32,st.d+e.deltaY*.01))};
    const cv=renderer.domElement;cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('wheel',wheel,{passive:true});
    const rs=()=>{renderer.setSize(w(),h());cam.aspect=w()/h();cam.updateProjectionMatrix()};addEventListener('resize',rs);
    let raf,t0=performance.now();const loop=()=>{raf=requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
      const az=st.az+Math.sin(t*.15)*.05;cam.position.set(Math.sin(az)*st.d*Math.cos(st.el),st.d*Math.sin(st.el),Math.cos(az)*st.d*Math.cos(st.el));cam.lookAt(0,0,0);
      Object.entries(st.map).forEach(([id,g])=>{const s=st.status?.[id];const mat=g.userData.body.material;const pulse=(s==='overtime'||s==='cleaning');mat.emissiveIntensity=pulse?.35+Math.abs(Math.sin(t*3))*.6:.18;g.userData.lab.position.y=2.15+(st.sel===id?Math.sin(t*4)*.12:0)});
      pl.intensity=1.1+Math.sin(t*1.5)*.25;renderer.render(scene,cam)};loop();
    return()=>{cancelAnimationFrame(raf);removeEventListener('resize',rs);cv.remove();renderer.dispose()}},[]);
  useEffect(()=>{const st=S.current;if(!st.scene)return;st.status=status;st.sel=selected;
    const ids=new Set(rooms.map(r=>r.id));Object.keys(st.map).forEach(id=>{if(!ids.has(id)){st.scene.remove(st.map[id]);delete st.map[id]}});
    rooms.forEach(r=>{let g=st.map[r.id];if(!g){g=makeRoom(r.number);st.map[r.id]=g;st.scene.add(g)}if(g.userData.num!==r.number){g.remove(g.userData.lab);g.userData.lab=sprite(r.number);g.userData.num=r.number;g.add(g.userData.lab)}
      g.position.set(r.x||0,0,r.z||0);const c=new THREE.Color(STATUS[status[r.id]||'free'].c);g.userData.body.material.color.copy(c);g.userData.body.material.emissive.copy(c)});
    const oi=new Set(objects.map(o=>o.id));Object.keys(st.omap).forEach(id=>{if(!oi.has(id)){st.scene.remove(st.omap[id]);delete st.omap[id]}});
    objects.forEach(o=>{let g=st.omap[o.id];if(!g||g.userData.type!==o.type){if(g)st.scene.remove(g);g=makeObject(o.type);st.omap[o.id]=g;st.scene.add(g)}g.position.set(o.x||0,0,o.z||0)})},
    [rooms,objects,JSON.stringify(status),selected,edit]);
  return null}

    <div className="glass hero">

      <div className="sub">Reserva con total discreción · Atención 24 horas</div>
      <div className="row" style={{justifyContent:'center',marginBottom:18}}>

    {view==='reserve'&&<Reserve onClose={()=>setView('')}/>}
    {view==='wait'&&<Waiting onClose={()=>setView('')}/>}

function ReservationCard({r,S}){const room=S.data.rooms.find(x=>x.id===r.room);const m={pending:['En espera de confirmación','#facc15'],approved:['Reserva confirmada','#22c55e'],rejected:['Rechazada','#ef233c'],used:['Utilizada','#6b7280']}[r.status];
  return <div style={{textAlign:'center'}}><h3>Reserva {r.code}</h3><span className="chip" style={{background:m[1]}}>{m[0]}</span>
    <p>Habitación <b>{room?.number||'—'}</b> · {room?.category}<br/>{fdate(r.start)} → {fdate(r.end)}<br/>{money(r.amount)}</p>{r.status==='approved'&&<QR text={'MOTEL:RES:'+r.code}/>}</div>}

function Reserve({onClose}){
  const S=useS();const [step,setStep]=useState(0);const [ced,setCed]=useState('');const [hash,setHash]=useState(SS('cli'));
  const [mode,setMode]=useState('hours');const [hours,setHours]=useState(2);const [start,setStart]=useState(toLocalInput(Date.now()+10*60000));const [sel,setSel]=useState(null);const [proof,setProof]=useState('');const [done,setDone]=useState(null);
  const login=async()=>{if(ced.trim().length<5)return toast('Ingresa tu cédula','err');const h=await sha(ced.trim());
    if(!S.data.clients.find(c=>c.id===h))S.put('clients',{id:h,at:Date.now()});SS('cli',h);setHash(h);setStep(1)};  // mismo flujo exista o no: anónimo
  useEffect(()=>{if(hash&&step===0)setStep(1)},[]);
  const s=new Date(start).getTime();const e=s+(mode==='night'?S.settings.nightHours:hours)*3600000;
  const rooms=S.data.rooms.map(r=>({r,c:conflict(r,s,e,S)}));
  const mine=hash?S.data.reservations.filter(r=>r.cli===hash).sort((a,b)=>b.createdAt-a.createdAt):[];
  const submit=()=>{if(!proof)return toast('Adjunta el comprobante de pago','err');const room=S.data.rooms.find(r=>r.id===sel);if(conflict(room,s,e,S))return toast('Ya no está disponible','err');
    const r={id:uid(),code:null,room:sel,cli:hash,start:s,end:e,mode,hours,amount:priceFor(room,mode,hours,S),proof,status:'pending',createdAt:Date.now()};S.put('reservations',r);setDone(r);setStep(3)};
  return <Modal wide onClose={onClose}><h2>Reservar habitación</h2>
    {step===0&&<div style={{maxWidth:360,margin:'auto'}}><p className="mut">Ingresa tu número de cédula. Tu información es confidencial y se almacena de forma anónima.</p><Field l="Cédula"><input inputMode="numeric" value={ced} onChange={x=>setCed(x.target.value.replace(/\D/g,''))} onKeyDown={x=>x.key==='Enter'&&login()} autoFocus/></Field><button className="btn p" style={{width:'100%'}} onClick={login}>Continuar</button></div>}
    {step===1&&<><div className="row"><Field l="Modalidad"><select value={mode} onChange={x=>setMode(x.target.value)}><option value="hours">Por horas</option><option value="night">Noche ({S.settings.nightHours} h)</option></select></Field>
      {mode==='hours'&&<Field l="Horas"><select value={hours} onChange={x=>setHours(+x.target.value)}>{[1,2,3,4,5,6,8,10].map(h=><option key={h}>{h}</option>)}</select></Field>}
      <Field l="Ingreso"><input type="datetime-local" value={start} onChange={x=>setStart(x.target.value)}/></Field></div>
      <div className="grid">{rooms.map(({r,c},i)=><div key={r.id} className="card room-card" style={{'--c':c?'#6b7280':'#22c55e',opacity:c?.5:1,outline:sel===r.id?'2px solid var(--red)':'none',animationDelay:i*40+'ms'}} onClick={()=>!c&&setSel(r.id)}>
        <h4>Habitación {r.number}</h4><div className="mut">{r.category}</div><div style={{margin:'6px 0'}}><b>{money(priceFor(r,mode,hours,S))}</b></div>{c?<span className="chip" style={{background:'#6b7280'}}>{c}</span>:<span className="chip" style={{background:'#22c55e'}}>Disponible</span>}</div>)}</div>
      <div className="row" style={{marginTop:14}}><button className="btn" onClick={()=>setStep(2.5)}>Mis solicitudes ({mine.length})</button><span className="sp"/><button className="btn p" disabled={!sel} onClick={()=>setStep(2)}>Continuar al pago</button></div></>}
    {step===2&&<><p>Total a pagar: <b className="big">{money(priceFor(S.data.rooms.find(r=>r.id===sel),mode,hours,S))}</b></p><p className="mut">{S.settings.payInfo}</p><PayMethods S={S}/>
      <Field l="Comprobante de pago"><input type="file" accept="image/*" onChange={async x=>x.target.files[0]&&setProof(await imgToData(x.target.files[0]))}/></Field>{proof&&<img className="proof" src={proof}/>}
      <div className="row" style={{marginTop:12}}><button className="btn" onClick={()=>setStep(1)}>Atrás</button><span className="sp"/><button className="btn p" onClick={submit}>Enviar solicitud</button></div></>}
    {step===3&&<div style={{textAlign:'center'}}><svg className="check" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/><path d="M34 62l17 17 36-38"/></svg><h3>Solicitud enviada</h3><p className="mut">En espera de confirmación del administrador. Puedes ver el estado en “Mis solicitudes”; cuando sea aprobada recibirás tu código de reserva.</p><button className="btn p" onClick={()=>setStep(2.5)}>Ver mis solicitudes</button></div>}
    {step===2.5&&<><button className="btn sm" onClick={()=>setStep(1)}>← Volver</button><div className="grid" style={{marginTop:10}}>{mine.map(r=><div key={r.id} className="card"><ReservationCard r={r} S={S}/></div>)}{!mine.length&&<div className="mut">Aún no tienes solicitudes.</div>}</div></>}
  </Modal>}

function Waiting({onClose}){
  const S=useS();const [ced,setCed]=useState('');const [me,setMe]=useState(SS('wait'));const [cat,setCat]=useState('');
  const list=S.data.waiting.filter(w=>w.status==='waiting').sort((a,b)=>a.at-b.at);const pos=me?list.findIndex(w=>w.id===me)+1:0;
  const free=S.data.rooms.filter(r=>r.status==='free'&&(!cat||r.category===cat));
  const join=async()=>{if(ced.length<5)return toast('Ingresa tu cédula','err');const h=await sha(ced);const ex=list.find(w=>w.cli===h);if(ex){SS('wait',ex.id);return setMe(ex.id)}const w={id:uid(),cli:h,cat,at:Date.now(),status:'waiting'};S.put('waiting',w);SS('wait',w.id);setMe(w.id)};
  const leave=()=>{S.put('waiting',{id:me,status:'left'});SS('wait',null);setMe(null)};
  return <Modal onClose={onClose}><h2>Sala de espera</h2>

function ObjDeleter({S}){return <select style={{width:'auto'}} value="" onChange={e=>e.target.value&&S.del('objects',e.target.value)}><option value="">🗑 Quitar objeto…</option>{S.data.objects.map(o=><option key={o.id} value={o.id}>{OBJ_LABEL[o.type]} ({o.x},{o.z})</option>)}</select>}
function useNow(){const [n,setN]=useState(Date.now());useEffect(()=>{const i=setInterval(()=>setN(Date.now()),1000);return()=>clearInterval(i)},[]);return n}

function RoomPanel({S,id,now,onClose}){

      {sub==='liq'&&<div className="card" style={{marginTop:10}}><h4>Liquidar habitación</h4><div className="row"><span>Total a cobrar: <b className="big">{money(tot.total)}</b></span><span className="sp"/><select style={{width:150}} value={method} onChange={e=>setMethod(e.target.value)}>{['Efectivo','Tarjeta','Transferencia','Nequi'].map(m=><option key={m}>{m}</option>)}</select><button className="btn g" onClick={()=>setInv(liquidate(S,room,acc,method))}>Confirmar y facturar</button></div></div>}</>}
    {st==='free'&&<div className="card" style={{marginTop:12}}><h4>Iniciar ocupación</h4><div className="row"><select style={{width:140}} value={mode} onChange={e=>setMode(e.target.value)}><option value="hours">Por horas</option><option value="night">Noche</option></select>{mode==='hours'&&<input style={{width:80}} type="number" min="1" value={h} onChange={e=>setH(+e.target.value)}/>}<b>{money(priceFor(room,mode,h,S))}</b><span className="sp"/><button className="btn p" onClick={start}>Iniciar</button></div></div>}

    <div className="row" style={{marginTop:12}}><QR text={'MOTEL:ROOM:'+room.number} size={3}/><div className="hint">QR de la habitación. Imprímelo y pégalo en la puerta; la colaboradora lo escanea (o usa un tag NFC) para iniciar el aseo.</div></div></Modal>}

  {cleaning.length>0&&<><h3>🧹 Habitaciones en limpieza — asignar</h3><div className="grid">{cleaning.map(r=><div key={r.id} className="card room-card hl" style={{'--c':STATUS.cleaning.c}}><b>Hab {r.number}</b> {r.cleanStart&&<span className="mut">· {dur(now-r.cleanStart)}</span>}<select style={{marginTop:8}} value={r.cleaner||''} onChange={e=>S.put('rooms',{id:r.id,cleaner:e.target.value||null})}><option value="">Sin asignar</option>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>)}</div></>}
  <h3>Tiempo de limpieza por habitación</h3><div className="grid">{byRoom.map(({r,l,a})=><div key={r.id} className="card" onClick={()=>open(r.id)} style={{cursor:'pointer'}}><b>Hab {r.number}</b><div className="big" style={{fontSize:22}}>{l.length?a.toFixed(1)+' min':'—'}</div><div className="bar"><i style={{width:a/mx*100+'%'}}/></div><div className="hint">{l.length} aseos · mejor {l.length?Math.min(...l.map(c=>c.mins)).toFixed(1):'—'} min</div></div>)}</div>

function Reservas({S}){
  const [f,setF]=useState('pending');const [m,setM]=useState(null);const [img,setImg]=useState(null);
  const list=S.data.reservations.filter(r=>f==='all'||r.status===f).sort((a,b)=>b.createdAt-a.createdAt);
  const approve=r=>{const room=S.data.rooms.find(x=>x.id===r.room);if(conflict(room,r.start,r.end,S,r.id))return toast('Conflicto de horario con otra reserva/ocupación','err');S.put('reservations',{id:r.id,status:'approved',code:r.code||code6()});toast('Reserva aprobada')};
  const checkin=r=>{const room=S.data.rooms.find(x=>x.id===r.room);if(room.status!=='free')return toast('La habitación no está libre','err');startOccupation(S,room,{minutes:Math.round((r.end-r.start)/60000),mode:r.mode,amount:r.amount,name:'Reserva '+r.code});S.put('reservations',{id:r.id,status:'used'});toast('Ocupación iniciada')};
  return <><h2>Solicitudes de reserva</h2><div className="row" style={{marginBottom:12}}>{[['pending','Pendientes'],['approved','Aprobadas'],['rejected','Rechazadas'],['used','Usadas'],['all','Todas']].map(([k,l])=><button key={k} className={'btn sm '+(f===k?'p':'')} onClick={()=>setF(k)}>{l}</button>)}</div>
    <div className="grid">{list.map(r=>{const room=S.data.rooms.find(x=>x.id===r.room);return <div key={r.id} className="card"><div className="row"><b>Hab {room?.number}</b><span className="sp"/>{r.code&&<span className="chip" style={{background:'#fff'}}>{r.code}</span>}</div>
      <div className="mut">{fdate(r.start)} → {fdate(r.end)}</div><div><b>{money(r.amount)}</b> · {r.mode==='night'?'Noche':r.hours+' h'}</div>{r.proof&&<img className="thumb" src={r.proof} style={{margin:'8px 0',cursor:'zoom-in'}} onClick={()=>setImg(r.proof)}/>}
      <div className="row">{r.status==='pending'&&<><button className="btn sm g" onClick={()=>approve(r)}>Aceptar</button><button className="btn sm" style={{background:'#7f1d1d'}} onClick={()=>S.put('reservations',{id:r.id,status:'rejected'})}>Rechazar</button></>}
      {['pending','approved'].includes(r.status)&&<button className="btn sm" onClick={()=>setM({...r})}>Modificar</button>}{r.status==='approved'&&<button className="btn sm p" onClick={()=>checkin(r)}>Check-in</button>}<button className="btn sm" onClick={()=>confirm('¿Eliminar?')&&S.del('reservations',r.id)}>🗑</button></div></div>})}{!list.length&&<div className="mut">Sin solicitudes.</div>}</div>
    {img&&<Modal onClose={()=>setImg(null)}><img className="proof" src={img}/></Modal>}
    {m&&<Modal onClose={()=>setM(null)}><h3>Modificar reserva</h3><Field l="Habitación"><select value={m.room} onChange={e=>setM({...m,room:e.target.value})}>{S.data.rooms.map(r=><option key={r.id} value={r.id}>{r.number} · {r.category}</option>)}</select></Field>
      <Field l="Ingreso"><input type="datetime-local" value={toLocalInput(m.start)} onChange={e=>{const s=new Date(e.target.value).getTime();setM({...m,start:s,end:s+(m.end-m.start)})}}/></Field>
      <Field l="Duración (horas)"><input type="number" step=".5" value={(m.end-m.start)/3600000} onChange={e=>setM({...m,end:m.start+e.target.value*3600000})}/></Field><Field l="Valor"><input type="number" value={m.amount} onChange={e=>setM({...m,amount:+e.target.value})}/></Field>
      <button className="btn p" onClick={()=>{const room=S.data.rooms.find(x=>x.id===m.room);if(conflict(room,m.start,m.end,S,m.id))return toast('Conflicto de horario','err');S.put('reservations',m);setM(null)}}>Guardar</button></Modal>}</>}

function newRoomDraft(S){const rs=S.data.rooms;const nums=rs.map(r=>parseInt(r.number)).filter(n=>!isNaN(n));const last=rs[rs.length-1];
  let x=0,z=0;const taken=(a,b)=>rs.some(r=>Math.abs(r.x-a)<1.8&&Math.abs(r.z-b)<1.8);for(let zz=-2.2;zz<=7;zz+=3.8){for(let xx=-7.5;xx<=7.5;xx+=3){if(!taken(xx,zz)){x=xx;z=zz;zz=99;break}}}
  return {id:uid(),number:String(nums.length?Math.max(...nums)+1:101),category:last?.category||S.settings.categories[0],priceHour:last?.priceHour||30000,priceNight:last?.priceNight||120000,defaultMin:last?.defaultMin||120,x,z,tagId:'',status:'free',accountId:null}}
function RoomForm({S,init,onClose}){
  const [f,setF]=useState(init);

/* ================= Servicios generales ================= */
function Servicio(){
  const S=useS();const now=useNow();const [me,setMe]=useState(SS('svc'));const [ced,setCed]=useState('');const [tab,setTab]=useState('work');const [sel,setSel]=useState(null);const [scan,setScan]=useState(false);const [man,setMan]=useState('');
  const user=S.data.staff.find(s=>s.id===me&&s.active!==false);const A=useAlerts(S,now,!!user);
  const status={};S.data.rooms.forEach(r=>status[r.id]=roomStatus(r,S.data.accounts,now));
  if(!user)return <div className="ui" style={{justifyContent:'center'}}><div className="glass hero" style={{maxWidth:380}}><div style={{fontSize:38}}>🧹</div><h2 className="brand">Servicios generales</h2><Field l="Cédula"><input inputMode="numeric" value={ced} onChange={e=>setCed(e.target.value.replace(/\D/g,''))} onKeyDown={e=>e.key==='Enter'&&document.getElementById('sg').click()}/></Field>
    <button id="sg" className="btn p" style={{width:'100%'}} onClick={()=>{const s=S.data.staff.find(x=>x.cedula===ced&&x.active!==false);if(!s)return toast('Cédula no autorizada','err');SS('svc',s.id);setMe(s.id)}}>Ingresar</button></div></div>;
  const clean=S.data.rooms.filter(r=>status[r.id]==='cleaning').sort((a,b)=>(b.cleaner===user.id)-(a.cleaner===user.id));const room=S.data.rooms.find(r=>r.id===sel);
  const verify=v=>{v=String(v||'').trim().toUpperCase();const ok=[`MOTEL:ROOM:${room.number}`.toUpperCase(),String(room.number).toUpperCase(),(room.tagId||'').toUpperCase()].filter(Boolean).includes(v);
    if(!ok)return toast('El tag no corresponde a esta habitación','err');S.put('rooms',{id:room.id,cleanStart:Date.now(),cleaner:user.id});setScan(false);setMan('');toast('Limpieza iniciada ✔')};
  const nfc=async()=>{try{toast('Acerca el tag NFC…');const r=await readNFC();verify(r.text||r.serial)}catch(e){toast(e.message,'err')}};
  const finish=()=>{const mins=(Date.now()-room.cleanStart)/60000;S.put('cleanlogs',{id:uid(),roomId:room.id,roomNumber:room.number,staffId:user.id,staffName:user.name,start:room.cleanStart,end:Date.now(),mins});S.put('rooms',{id:room.id,status:'free',cleanStart:null,cleaner:null});setSel(null);toast('Habitación libre ✔')};
  return <div className="ui"><Scene rooms={S.data.rooms} objects={S.data.objects} status={status} edit={false} selected={sel} onRoom={id=>{setSel(id)}} onMove={()=>{}}/>
    <div className="glass top"><div className="brand">🧹 {user.name}</div><div className="tabs">{[['work','Mi trabajo'],['map','Mapa']].map(([k,l])=><button key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>setTab(k)}>{l}</button>)}</div><Bell A={A} onPick={setSel}/><button className="btn sm" onClick={()=>{SS('svc',null);setMe(null)}}>Salir</button></div>
    {tab==='work'?<div className="glass panel"><h2>Habitaciones en limpieza ({clean.length})</h2><div className="grid">{clean.map(r=><div key={r.id} className={'card room-card hl'} style={{'--c':STATUS.cleaning.c}} onClick={()=>setSel(r.id)}><div className="row"><b>Hab {r.number}</b><span className="sp"/>{r.cleaner===user.id&&<span className="chip" style={{background:'#facc15'}}>Asignada a ti</span>}</div><div className="mut">{r.cleanStart?'En curso '+dur(now-r.cleanStart):'Pendiente de iniciar'}</div></div>)}{!clean.length&&<div className="mut">No hay habitaciones pendientes. 🎉</div>}</div></div>
      :<><div style={{flex:1,pointerEvents:'none'}}/><div className="glass legend">{Object.entries(STATUS).map(([k,v])=><span key={k}><i className="dot" style={{background:v.c}}/>{v.l}</span>)}</div></>}
    {room&&<Modal onClose={()=>setSel(null)}><h2>Habitación {room.number}</h2><Chip s={status[room.id]}/>
      {status[room.id]==='cleaning'?(room.cleanStart?<div style={{textAlign:'center',margin:'16px 0'}}><div className="mut">TIEMPO DE LIMPIEZA</div><div className="big" style={{fontSize:56}}>{dur(now-room.cleanStart)}</div>{room.cleaner===user.id||!room.cleaner?<button className="btn g" onClick={finish}>✔ Terminar limpieza</button>:<div className="mut">En curso por otra colaboradora</div>}</div>
        :<div style={{margin:'14px 0'}}><p className="mut">Para iniciar, escanea el tag NFC o el QR de la habitación.</p><div className="row"><button className="btn p" onClick={nfc}>📡 Escanear NFC</button><button className="btn p" onClick={()=>setScan(true)}>📷 Escanear QR</button></div><div className="row" style={{marginTop:10}}><input style={{flex:1}} placeholder="Código manual (ej. MOTEL:ROOM:101)" value={man} onChange={e=>setMan(e.target.value)}/><button className="btn" onClick={()=>verify(man)}>Validar</button></div></div>)
      :<p className="mut">Esta habitación no está en limpieza.</p>}</Modal>}
    {scan&&<QRScanner onClose={()=>setScan(false)} onResult={verify}/>}</div>}

/* ================= Checador ================= */
function Checador(){
  const S=useS();const [v,setV]=useState('');const [res,setRes]=useState(null);const ref=useRef();
  useEffect(()=>{ref.current?.focus()},[res]);
  const go=val=>{val=String(val).trim();if(!val)return;const s=S.data.staff.find(x=>x.active!==false&&(x.cedula===val||(x.tagId&&x.tagId===val)));setV('');
    if(!s){setRes({ok:false});setTimeout(()=>setRes(null),2500);return}
    const last=S.data.attendance.filter(a=>a.staffId===s.id).sort((a,b)=>b.at-a.at)[0];const type=last?.type==='in'?'out':'in';
    S.put('attendance',{id:uid(),staffId:s.id,name:s.name,type,at:Date.now()});setRes({ok:true,name:s.name,type});siren(.5);setTimeout(()=>setRes(null),3000)};
  const nfc=async()=>{try{toast('Acerca el tag…');const r=await readNFC();go(r.serial||r.text);if(r.text)go(r.text)}catch(e){toast(e.message,'err')}};
  return <div className="ui" style={{justifyContent:'center'}}><div className="glass hero">
    {res?<div style={{animation:'pop .3s'}}><svg className={'check '+(res.ok?'':'cross')} viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/>{res.ok?<path d="M34 62l17 17 36-38"/>:<path d="M40 40l40 40M80 40L40 80"/>}</svg><h2>{res.ok?res.name:'No autorizado'}</h2><div className="big" style={{color:res.ok?'#22c55e':'#ef233c'}}>{res.ok?(res.type==='in'?'INGRESO REGISTRADO':'SALIDA REGISTRADA'):'Cédula o tag no válido'}</div></div>
    :<><div style={{fontSize:44}}>⏱</div><h1 className="brand">Checador</h1><div className="sub">Digita tu cédula o acerca tu tag NFC</div><input ref={ref} style={{fontSize:22,textAlign:'center'}} inputMode="numeric" value={v} onChange={e=>setV(e.target.value.replace(/\D/g,''))} onKeyDown={e=>e.key==='Enter'&&go(v)} autoFocus/>
      <div className="row" style={{justifyContent:'center',marginTop:14}}><button className="btn p" onClick={()=>go(v)}>Registrar</button><button className="btn" onClick={nfc}>📡 NFC</button></div></>}</div></div>}

  return <Ctx.Provider value={S}>
    {route==='admin'?<Admin/>:route==='servicio'?<Servicio/>:route==='checador'?<><Scene rooms={S.data.rooms} objects={S.data.objects} status={status} edit={false} onRoom={()=>{}} onMove={()=>{}}/><Checador/></>
      :<><Scene rooms={S.data.rooms} objects={S.data.objects} status={status} edit={false} onRoom={()=>{}} onMove={()=>{}}/><Landing/></>}
    <ToastHost/></Ctx.Provider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
